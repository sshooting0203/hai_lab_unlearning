seed: 0
num_experts: 4
batch_size: 4
device: cuda
max_n_edits: 1000 # @@ 수정
dropout: 0.0
single_batch: False
check_dir: null
re_init_model: False
gate_lambda: 1e-2

data:
  path: null
  rephrase: true
  zsre_nq: false
  zsre_impl: false
  zsre_impl_path: ${hydra:runtime.cwd}/dataset/zsre/impl_{}.json
  zsre_yn: false
  zsre_yn_path: ${hydra:runtime.cwd}/dataset/zsre/zsre_yn_{}.txt
  zsre_eval_idxs: null
  zsre_path: ${hydra:runtime.cwd}/dataset/zsre/structured_zeroshot-{}-new_annotated_final.jsonl
  nq_path: ${hydra:runtime.cwd}/dataset/nq
  wiki_webtext: true
  n_edits: 1
  hard_neg: false
  hard_neg_neighbors: 100
  hard_neg_exclude: 25
  hard_neg_temp: 0.1
  hard_neg_prob: 0.5
  flip_inner_outer: false
  sent_eval_sample: false
  n_outer_max: null

hydra:
  run:
    dir: ./outputs/${now:%Y-%m-%d_%H-%M-%S_%f${uuid:}}
  sweep:
    dir: ./outputs/${now:%Y-%m-%d_%H-%M-%S_%f}
    subdir: ${hydra.job.num}



